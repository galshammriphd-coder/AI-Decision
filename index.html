<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>اتخاذ القرار في عصر الذكاء الاصطناعي: بين الحكمة والجرأة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@500;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --surface:#F4F6FB; --surface2:#EEF1F8; --ink:#141A33; --ink2:#2E3657; --muted:#5B6385; --line:#E1E5EF;
  --wisdom:#23307A; --courage:#C2410C;
  --s1:#5B3FD9; --s1t:#F1EEFD;
  --s2:#D12A45; --s2t:#FDEEF1;
  --s3:#0A8FA8; --s3t:#E8F7FA;
  --s4:#C98505; --s4t:#FDF5E4;
  --s5:#138A5B; --s5t:#E8F6EF;
  --ok:#138A5B; --bad:#C62839;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",Tahoma,"Segoe UI",sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --acc:var(--wisdom); --acct:#EEF0FA;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{overflow-x:clip;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.85}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--display);line-height:1.35;margin:0;color:var(--ink);font-weight:600}
p{margin:0 0 .8em}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:3px solid #6B7CFF;outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--wisdom);display:grid;place-items:center}
.brand b{font-family:var(--display);font-size:15px;font-weight:600;display:block;line-height:1.3}
.brand small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.prog{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .bar{width:120px;height:6px;border-radius:9px;background:var(--surface2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--s5);width:0;transition:width .4s}
nav.tabs{border-top:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;height:50px;align-items:center;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 10px;border-radius:9px;color:var(--ink2);font-size:14px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:7px;text-decoration:none}
.tab:hover{background:var(--surface)}
.tab .d{width:9px;height:9px;border-radius:50%}
.tab[aria-current="page"]{background:var(--ink);color:#fff}
.tab .chk{font-size:11px;color:var(--ok)}
.tab[aria-current="page"] .chk{color:#8BE3B9}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex-shrink:0}

/* ---------- generic ---------- */
main{min-height:70vh}
.view{display:none;padding:34px 0 80px}
.view.on{display:block}
.eyebrow{font-size:13.5px;font-weight:600;color:var(--acc);margin-bottom:6px;display:block}
.lead{font-size:19px;color:var(--ink2);max-width:68ch}
.muted{color:var(--muted)}
.sec{margin-top:56px}
.sec>h2{font-size:26px;margin-bottom:8px}
.sec>.sub{color:var(--muted);margin-bottom:22px;max-width:70ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}body{font-size:16px}}
.box{border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;background:#fff}
.box h3{font-size:18px;margin-bottom:6px}
.tint{background:var(--acct);border-color:transparent}
.rule{border-radius:var(--r-md);padding:18px 22px;background:var(--ink);color:#fff;font-family:var(--display);font-size:19px;font-weight:500;display:flex;gap:14px;align-items:flex-start;line-height:1.7}
.rule .ic{flex-shrink:0;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:15px;margin-top:3px}
.rule small{display:block;font-family:var(--body);font-size:13px;opacity:.75;font-weight:400}
.pill{display:inline-block;font-size:13px;padding:3px 11px;border-radius:99px;background:var(--surface);color:var(--ink2);font-weight:500;margin:3px 0 3px 6px}
.btn{text-decoration:none;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-weight:600;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface);filter:none}
.btn.sm{padding:6px 13px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.en{font-family:"Readex Pro",sans-serif;direction:ltr;unicode-bidi:isolate;font-size:.82em;color:var(--muted);font-weight:500}
.num{font-family:var(--display);font-feature-settings:"tnum";}
textarea,input[type=text],select{font-family:inherit;font-size:15.5px;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
.hide{display:none!important}

/* ---------- home ---------- */
.hero{padding:26px 0 10px;display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.hero>*{min-width:0}
@media (max-width:980px){.hero{grid-template-columns:1fr;gap:30px}}
.hero h1{font-size:clamp(34px,5.2vw,58px);font-weight:700;line-height:1.2;letter-spacing:-.5px}
.hero h1 .l2{display:block;font-weight:400;color:var(--ink2);font-size:.62em;margin-top:10px}
.hero .meta{display:flex;flex-wrap:wrap;gap:22px;margin-top:26px;font-size:14.5px;color:var(--muted)}
.hero .meta b{display:block;color:var(--ink);font-size:15.5px;font-weight:600}
.slogan{margin-top:26px;border-inline-start:3px solid var(--wisdom);padding:4px 16px 4px 0;font-family:var(--display);font-size:18px;color:var(--ink2)}
.slogan small{display:block;font-size:14px;color:var(--muted);margin-top:4px;font-family:var(--body)}
/* equation */
.eq{position:relative;border:1px solid var(--line);border-radius:22px;padding:22px;background:linear-gradient(180deg,#fff, #F7F8FC)}
.eq h2{font-size:17px;text-align:center;margin-bottom:2px}
.eq .cap{text-align:center;font-size:13.5px;color:var(--muted);margin-bottom:16px}
.eq-row{display:flex;align-items:center;justify-content:center;gap:4px}
@media (max-width:520px){.pillar{font-size:11px;padding:10px 1px;overflow-wrap:anywhere}.pillar .ico{font-size:18px}.op{font-size:14px}}
.pillar{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 4px;flex:1 1 0;min-width:0;line-height:1.45;text-align:center;font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink);transition:transform .2s,border-color .2s,box-shadow .2s}
.pillar .ico{font-size:22px;display:block;line-height:1.3}
.pillar:hover,.pillar[aria-pressed="true"]{transform:translateY(-3px);border-color:var(--pc);box-shadow:0 8px 20px -10px var(--pc)}
.op{color:var(--muted);font-weight:600;font-size:18px}
.eq-result{margin:14px auto 0;display:flex;align-items:center;justify-content:center;gap:10px}
.eq-result .res{background:var(--s5);color:#fff;border-radius:14px;padding:12px 22px;font-family:var(--display);font-weight:600;font-size:18px}
.eq-note{margin-top:16px;min-height:78px;border-radius:12px;background:var(--surface);padding:12px 16px;font-size:15px;color:var(--ink2)}
.eq-note b{font-family:var(--display)}
/* journey */
.journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;counter-reset:st}
@media (max-width:980px){.journey{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.journey{grid-template-columns:1fr}}
.stc{position:relative;text-align:start;border:1px solid var(--line);border-radius:16px;padding:20px 18px 18px;background:#fff;color:var(--ink);transition:border-color .2s, transform .2s;display:flex;flex-direction:column;gap:8px}
.stc:hover{border-color:var(--c);transform:translateY(-2px)}
.stc .n{display:flex;align-items:center;justify-content:space-between}
.stc .n span:first-child{width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.stc .code{font-family:"Readex Pro";font-weight:700;letter-spacing:1.5px;font-size:12.5px;color:var(--c)}
.stc h3{font-size:17px}
.stc .q{font-size:14px;color:var(--muted);line-height:1.7}
.stc .done{position:absolute;top:12px;left:12px;font-size:12px;color:var(--ok);font-weight:600}
.obj{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.obj .k{font-family:var(--display);font-weight:600;color:var(--wisdom);min-width:28px;font-size:15px;padding-top:2px}
.sched{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:800px){.sched{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sched .box{padding:16px}
.sched .t{font-family:var(--display);font-weight:600;font-size:16px}
.methods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.methods{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mth{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;text-align:start;color:var(--ink)}
.mth:hover{background:var(--surface)}
.mth .i{font-size:22px}
.mth b{display:block;font-family:var(--display);font-weight:600;margin-top:4px}
.mth span{font-size:13.5px;color:var(--muted);line-height:1.6;display:block}

/* ---------- station ---------- */
.shead{border-radius:24px;padding:34px 34px 30px;background:var(--acct);position:relative;overflow:hidden}
.shead .code{font-family:"Readex Pro";font-weight:700;letter-spacing:2px;color:var(--acc);font-size:14px}
.shead h1{font-size:clamp(28px,4vw,42px);font-weight:700;margin:6px 0 14px;max-width:24ch}
.shead .gq{display:inline-flex;gap:12px;align-items:flex-start;background:#fff;border-radius:14px;padding:14px 18px;max-width:720px}
.shead .gq span{font-size:12.5px;font-weight:600;color:#fff;background:var(--acc);border-radius:7px;padding:2px 9px;white-space:nowrap;margin-top:4px}
.shead .gq p{margin:0;font-family:var(--display);font-size:18px;font-weight:500}
.shead .bignum{position:absolute;left:28px;bottom:-40px;font-family:var(--display);font-weight:700;font-size:200px;line-height:1;color:var(--acc);opacity:.08;pointer-events:none}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.toc a{font-size:14px;text-decoration:none;color:var(--ink2);border:1px solid var(--line);background:#fff;padding:5px 13px;border-radius:99px}
.toc a:hover{border-color:var(--acc);color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:700px){.stats{grid-template-columns:1fr}}
.stat{border:1px solid var(--line);border-radius:16px;padding:20px}
.stat .v{font-family:var(--display);font-weight:700;font-size:40px;color:var(--acc);line-height:1.1}
.stat .v small{font-size:18px;font-weight:600}
.stat p{margin:8px 0 0;font-size:15px;color:var(--ink2)}
/* concept cards */
.cc{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.cc>button{all:unset;box-sizing:border-box;display:flex;width:100%;gap:14px;align-items:flex-start;padding:18px 20px;cursor:pointer}
.cc>button:focus-visible{outline:3px solid #6B7CFF;outline-offset:-3px}
.cc .ic{width:40px;height:40px;border-radius:11px;background:var(--acct);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.cc h3{font-size:17.5px}
.cc .d{font-size:15px;color:var(--ink2);margin-top:3px;line-height:1.75}
.cc .ar{margin-inline-start:auto;transition:transform .25s;color:var(--muted);flex-shrink:0;margin-top:8px}
.cc[data-open="1"] .ar{transform:rotate(180deg)}
.cc .more{display:none;padding:0 20px 20px;border-top:1px dashed var(--line)}
.cc[data-open="1"] .more{display:block}
.cc .row{display:grid;grid-template-columns:140px 1fr;gap:12px;padding-top:12px;font-size:15px}
@media (max-width:560px){.cc .row{grid-template-columns:1fr;gap:2px}}
.cc .row b{font-family:var(--display);font-weight:600;font-size:14px;color:var(--acc)}
.cc .row.bad b{color:var(--bad)}
.cc .row.good b{color:var(--ok)}
/* compare */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
@media (max-width:700px){.vs{grid-template-columns:1fr}.vs .mid{display:none}}
.vs .mid{display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--muted)}
.steps{display:grid;gap:10px;counter-reset:s}
.step{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px 18px;background:#fff}
.step::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;flex-shrink:0;font-size:15px}
.step b{font-family:var(--display);font-weight:600;display:block}
.step span{color:var(--muted);font-size:15px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:500;color:var(--ink)}
.chain button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.chain i{color:var(--muted);font-style:normal}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table.t th{background:var(--surface);text-align:start;font-family:var(--display);font-weight:600;padding:12px 14px;font-size:14.5px;white-space:nowrap}
table.t td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
/* discussion */
.disc{border-radius:18px;padding:24px;background:#fff;border:1.5px dashed var(--acc);display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
@media (max-width:700px){.disc{grid-template-columns:1fr}}
.disc .ic{width:52px;height:52px;border-radius:14px;background:var(--acct);display:grid;place-items:center;font-size:24px}
.disc .lbl{font-size:13px;font-weight:600;color:var(--acc)}
.disc p{font-family:var(--display);font-size:19px;font-weight:500;margin:2px 0 0}
.timer{display:flex;align-items:center;gap:10px}
.timer .tm{font-family:var(--display);font-weight:700;font-size:22px;min-width:64px;text-align:center;font-feature-settings:"tnum"}
.disc .ins{grid-column:1/-1;display:none;background:var(--surface);border-radius:12px;padding:14px 18px;font-size:15.5px}
.disc .ins.on{display:block}
.complete{margin-top:60px;border-radius:20px;padding:26px;background:var(--surface);display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.complete h3{font-size:19px}

/* ---------- activities ---------- */
.act{border-radius:20px;border:1px solid var(--line);background:#fff;overflow:hidden}
.act .ah{padding:18px 22px;background:var(--surface);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.act .ah .tag{font-size:12.5px;font-weight:600;color:#fff;background:var(--acc);padding:3px 10px;border-radius:7px}
.act .ah h3{font-size:18px}
.act .ab{padding:22px}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;text-align:start;color:var(--ink);font-size:15.5px;line-height:1.6}
.opt:hover{border-color:var(--acc)}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--acct)}
.opt.ok{border-color:var(--ok);background:#E9F7F0}
.opt.no{border-color:var(--bad);background:#FDEEF0}
.fb{margin-top:14px;border-radius:12px;padding:14px 18px;font-size:15.5px;display:none}
.fb.on{display:block}
.fb.good{background:#E9F7F0;color:#0D5E3D}
.fb.warn{background:#FFF4E0;color:#7A4B00}
.fb.info{background:var(--surface);color:var(--ink2)}
/* sorter */
.sorter .item{display:grid;grid-template-columns:1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.sorter .item:last-child{border-bottom:0}
.sorter .item q{font-family:var(--display);font-weight:600;quotes:"«" "»"}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-size:14px;color:var(--ink2)}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.no{background:var(--bad);border-color:var(--bad);color:#fff}
/* dots grid */
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;max-width:420px;direction:ltr}
.dots i{aspect-ratio:1;border-radius:3px;background:#E3E6EF}
.dots i.tp{background:var(--s5)}
.dots i.fp{background:#F4B6BF}
.slider{display:grid;grid-template-columns:130px 1fr 60px;gap:12px;align-items:center;margin-bottom:10px}
.slider input{width:100%;accent-color:var(--acc)}
.slider output{font-family:var(--display);font-weight:600;text-align:center}
.legend{display:flex;gap:16px;font-size:13.5px;color:var(--muted);flex-wrap:wrap;margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
/* matrix */
.mx{display:grid;grid-template-columns:44px 1fr 1fr;grid-template-rows:1fr 1fr 34px;gap:8px;max-width:640px}
.mx .cell{border-radius:14px;padding:14px;min-height:118px;font-size:14px;border:1px solid var(--line);background:#fff}
.mx .cell b{font-family:var(--display);font-weight:600;display:block;font-size:15px;margin-bottom:4px}
.mx .cell.hot{background:#FDEEF0;border-color:#F3C1C9}
.mx .cell.warm{background:#FFF6E6;border-color:#F2DCAF}
.mx .cell.cool{background:#EAF7F0;border-color:#BFE5D1}
.mx .ax{font-size:12.5px;color:var(--muted);display:grid;place-items:center;text-align:center}
.mx .ay{writing-mode:vertical-rl;transform:rotate(180deg)}
.mx .cell.hit{outline:3px solid var(--ink);outline-offset:2px}
/* flashcards */
.fc-stage{perspective:1600px;max-width:720px;margin:0 auto}
.fc{position:relative;height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:34px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line)}
.fc .front{background:#fff}
.fc .back{background:var(--ink);color:#fff;transform:rotateY(180deg)}
.fc .front .st{font-size:13px;font-weight:600}
.fc .front h3{font-size:clamp(26px,4vw,36px);font-weight:700;margin:10px 0 6px}
.fc .back p{font-size:17.5px;line-height:1.9;margin:0}
.fc .hint{position:absolute;bottom:16px;inset-inline:0;text-align:center;font-size:13px;color:var(--muted)}
.fc .back .hint{color:rgba(255,255,255,.55)}
.fc-ctl{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.fc-count{font-family:var(--display);font-weight:600;min-width:80px;text-align:center}
.filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
/* quiz */
.qz{max-width:780px;margin:0 auto}
.qz .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted)}
.qz .qbar{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-bottom:24px}
.qz .qbar i{display:block;height:100%;background:var(--wisdom);transition:width .3s}
.qz h3{font-size:21px;margin-bottom:18px;line-height:1.6}
.score{text-align:center;padding:30px 10px}
.score .big{font-family:var(--display);font-size:64px;font-weight:700;color:var(--wisdom)}
/* glossary */
.gl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.gl{grid-template-columns:1fr}}
.gl .box{padding:16px 18px}
.gl .box h3{font-size:16.5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gl .box p{font-size:15px;margin:4px 0 0;color:var(--ink2)}
/* wisdom checklist */
.wis{display:grid;gap:10px}
.wr{display:grid;grid-template-columns:56px 150px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:#fff}
@media (max-width:700px){.wr{grid-template-columns:48px 1fr}.wr .q{grid-column:1/-1}.wr label{grid-column:1/-1}}
.wr .L{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:"Readex Pro";font-weight:700;font-size:22px}
.wr .nm b{display:block;font-family:var(--display);font-weight:600}
.wr .nm span{font-family:"Readex Pro";font-size:11.5px;letter-spacing:1px;font-weight:600}
.wr .q{font-size:15.5px}
.wr label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);white-space:nowrap}
.wr input{width:20px;height:20px;accent-color:var(--s5)}
/* crisis */
.wave{border:1px solid var(--line);border-radius:16px;padding:18px 20px;background:#fff;margin-bottom:12px}
.wave .wt{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.wave .wt b{font-family:var(--display);color:var(--ink);font-size:16px}
.log{width:100%;border-collapse:collapse;font-size:14.5px}
.log td,.log th{border-bottom:1px solid var(--line);padding:9px 10px;text-align:start}
.log th{font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:800px){.roles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.roles .box{padding:14px;text-align:center}
.roles .box .i{font-size:24px}
.roles .box b{display:block;font-family:var(--display);font-weight:600}
.roles .box span{font-size:13.5px;color:var(--muted);line-height:1.6;display:block}
.out{white-space:pre-wrap;font-size:15px;background:var(--surface);border-radius:12px;padding:16px;border:1px solid var(--line);min-height:120px;line-height:1.9}
.fld{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start;margin-bottom:10px}
@media (max-width:620px){.fld{grid-template-columns:1fr;gap:4px}}
.fld label{font-family:var(--display);font-weight:600;font-size:14.5px;padding-top:10px}
.fld label small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.5}
.lab-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.lab-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.lab-grid{grid-template-columns:1fr}}
.lab-card{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;text-align:start;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.lab-card:hover{border-color:var(--c,var(--ink))}
.lab-card .k{font-size:12.5px;font-weight:600;color:var(--c)}
.lab-card b{font-family:var(--display);font-weight:600;font-size:17px}
.lab-card span{font-size:14px;color:var(--muted);line-height:1.65}
.back-link{display:inline-flex;gap:6px;align-items:center;font-size:14.5px;color:var(--muted);text-decoration:none;margin-bottom:18px}
.back-link:hover{color:var(--ink)}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:12px;font-size:14.5px;transition:transform .3s,opacity .3s;z-index:99;opacity:0;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
/* ---------- failure dossiers ---------- */
.fl-top{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.fl-legend{display:flex;flex-wrap:wrap;gap:8px}
.fl-lg{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;gap:8px}
.fl-lg i{width:10px;height:10px;border-radius:3px;background:var(--k);transform:rotate(45deg)}
.fl-lg[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:1080px){.fl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.fl-grid{grid-template-columns:1fr}}
.fl-card{perspective:1400px;transition:opacity .35s,filter .35s,transform .35s}
.fl-card.dim{opacity:.28;filter:grayscale(1);transform:scale(.97)}
.fl-in{position:relative;height:392px;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.25,.4,1);cursor:pointer;border-radius:18px}
.fl-in.flip{transform:rotateY(180deg)}
.fl-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.fl-front{background:#fff;border:1px solid var(--line);box-shadow:0 1px 0 var(--line),0 18px 30px -24px color-mix(in srgb,var(--k) 70%,transparent)}
.fl-front::before,.fl-front::after{content:"";position:absolute;top:218px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line);z-index:2}
.fl-front::before{right:-12px}.fl-front::after{left:-12px}
.fl-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;position:relative;z-index:1}
.fl-code{font-family:var(--display);font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:6px}
.fl-code b{font-size:26px;font-weight:700;color:var(--k);line-height:1;letter-spacing:.5px}
.fl-cat{font-size:12px;font-weight:600;color:var(--k);border:1.5px solid color-mix(in srgb,var(--k) 45%,transparent);padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--k) 7%,#fff)}
.fl-art{margin:10px 14px 0;height:170px;border-radius:12px;display:grid;place-items:center;color:var(--k);position:relative;
 background:radial-gradient(color-mix(in srgb,var(--k) 22%,transparent) 1px,transparent 1.4px) 0 0/12px 12px,linear-gradient(160deg,color-mix(in srgb,var(--k) 9%,#fff),color-mix(in srgb,var(--k) 3%,#fff))}
.fl-art svg{width:86%;height:auto;overflow:visible}
.fl-front h4{font-family:var(--display);font-size:20px;font-weight:700;margin:26px 18px 4px;color:var(--ink);position:relative}
.fl-front h4::before{content:"";position:absolute;top:-16px;inset-inline:0;border-top:2px dashed var(--line)}
.fl-sym{margin:0 18px;font-size:14.5px;color:var(--muted);line-height:1.7}
.fl-flip{position:absolute;bottom:14px;inset-inline-start:18px;font-size:13px;font-weight:600;color:var(--k)}
.fl-seen{position:absolute;bottom:14px;inset-inline-end:18px;font-size:12px;font-weight:600;color:var(--ok)}
.fl-back{transform:rotateY(180deg);background:
 radial-gradient(120% 80% at 100% 0%,color-mix(in srgb,var(--k) 38%,transparent),transparent 60%),#141A33;color:#fff}
.fl-back .fl-code{color:rgba(255,255,255,.6)}.fl-back .fl-code b{color:#fff}
.fl-back .fl-cat{color:#fff;background:transparent;border-color:rgba(255,255,255,.35)}
.fl-back dl{margin:14px 18px 0;flex:1;display:flex;flex-direction:column;gap:2px}
.fl-back dt{font-family:var(--display);font-size:12px;font-weight:600;color:color-mix(in srgb,var(--k) 55%,#fff);margin-top:10px}
.fl-back dd{margin:0;font-size:14px;line-height:1.75;color:rgba(255,255,255,.9)}
.fl-back dd.fl-q{font-family:var(--display);font-size:15px;color:#fff;border-inline-start:3px solid var(--k);padding-inline-start:10px}
.fl-mark{margin:10px 16px 14px;display:flex;gap:8px;align-items:center;font-size:13.5px;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 12px;cursor:pointer}
.fl-mark input{width:18px;height:18px;accent-color:var(--k)}
.fl-meter{margin-top:22px;border:1px solid var(--line);border-radius:16px;padding:16px 20px;display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:center}
.fl-meter b[data-n]{font-family:var(--display);font-size:26px;display:block;line-height:1.2}
.fl-meter span{font-size:13px;color:var(--muted)}
.fl-bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.fl-bars i{height:12px;border-radius:4px;background:var(--surface2);transition:background .3s}
.fl-bars i.on{background:var(--k)}
.fl-meter p{grid-column:1/-1;margin:4px 0 0;font-size:14.5px;color:var(--ink2)}
/* micro-motion: plays only while the dossier is hovered/focused */
.fl-rain rect{animation:flRain 2.4s ease-in-out infinite paused}
@keyframes flRain{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.fl-spin{animation:flSpin 3s linear infinite paused}
@keyframes flSpin{to{transform:rotate(360deg)}}
.fl-dart{animation:flDart 1.8s ease-in-out infinite paused}
@keyframes flDart{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,-4px)}}
.fl-beam{transform-origin:74px 64px;animation:flBeam 2.6s ease-in-out infinite paused}
@keyframes flBeam{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.fl-dash{animation:flDash 1.2s linear infinite paused}
@keyframes flDash{to{stroke-dashoffset:-24}}
.fl-crack{stroke-dasharray:90;animation:flCrack 2s ease-in-out infinite paused}
@keyframes flCrack{0%{stroke-dashoffset:90}60%,100%{stroke-dashoffset:0}}
.fl-needle{animation:flNeedle 2.2s ease-in-out infinite paused}
@keyframes flNeedle{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.fl-hit{transform-box:fill-box;transform-origin:center;animation:flHit 1.6s ease-in-out infinite paused}
@keyframes flHit{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
.fl-in:hover :is(.fl-rain rect,.fl-spin,.fl-dart,.fl-beam,.fl-dash,.fl-crack,.fl-needle,.fl-hit),
.fl-in:focus-visible :is(.fl-rain rect,.fl-spin,.fl-dart,.fl-beam,.fl-dash,.fl-crack,.fl-needle,.fl-hit){animation-play-state:running}
.fl-in:hover:not(.flip){transform:translateY(-4px) rotateX(3deg)}

@media (max-width:620px){.prog .bar{display:none}.brand small{display:none}.prog{font-size:12px}.shead{padding:26px 20px}.shead .bignum{font-size:130px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* =================== DECK-MATCHED DESIGN LAYER =================== */
:root{--display:"Tajawal","Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;--ink:#1B2150;--ink2:#343C6B;--muted:#6A7196;--line:#E4E7F2;--surface:#F6F7FC;
 --grad:linear-gradient(90deg,#3B82F6,#7C3AED);--glow:0 18px 40px -22px}
h1,h2,h3,h4{font-weight:800;letter-spacing:0}
.hl{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 18px;border-radius:99px;background:#fff;font-family:var(--display);font-weight:700;font-size:14.5px;color:var(--acc,#5B3FD9);
 border:1.5px solid color-mix(in srgb,var(--acc,#7C3AED) 40%,#fff);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc,#7C3AED) 7%,transparent),0 6px 18px -10px var(--acc,#7C3AED)}
.bar-u{display:block;width:70px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc),#F2994A);margin:12px auto 0}
/* slide frame */
.frame{position:relative;border:1px solid var(--line);border-radius:26px;background:#fff;overflow:hidden}
.frame::before{content:"";position:absolute;top:-1px;left:44px;width:70px;height:48px;border-top:3px solid #7C6CF6;border-left:3px solid #7C6CF6;border-top-left-radius:18px;left:-1px}
.frame::after{content:"";position:absolute;bottom:-1px;right:-1px;width:70px;height:48px;border-bottom:3px solid #22B8CF;border-right:3px solid #22B8CF;border-bottom-right-radius:18px}
.confetti{position:absolute;inset:0;pointer-events:none;background:
 radial-gradient(circle,#F59E0B 2px,transparent 2.5px) 8% 18%/1px 1px no-repeat,radial-gradient(circle,#8B5CF6 2px,transparent 2.5px) 92% 12%/1px 1px no-repeat;opacity:.9}
.confetti i{position:absolute;width:5px;height:5px;border-radius:50%;opacity:.55}
.slide-foot{display:flex;justify-content:space-between;align-items:center;padding:0 26px 18px;font-size:13px;color:var(--muted)}
.dots3{display:flex;gap:5px}.dots3 i{width:7px;height:7px;border-radius:9px;background:#D5D9EA}.dots3 i.on{width:24px;background:var(--grad)}

/* header */
.brand .mark{background:linear-gradient(135deg,#3B82F6,#7C3AED);box-shadow:0 6px 16px -8px #7C3AED}
.tab[aria-current="page"]{background:linear-gradient(135deg,#2E3A8C,#5B3FD9);box-shadow:0 6px 16px -10px #5B3FD9}
.prog .bar i{background:linear-gradient(90deg,#22C55E,#0EA5E9)}

/* hero */
.hero-frame{padding:40px 38px 10px}
.hero h1{font-weight:800}
.hero h1 .l2{font-weight:800;font-size:.7em}
.hero h1 .l2 span{background:linear-gradient(90deg,#5B3FD9,#E0314B 55%,#F59E0B);-webkit-background-clip:text;background-clip:text;color:transparent}
.eq{border:0;background:#fff;box-shadow:0 0 0 1.5px #E4E1FB,0 24px 50px -30px #5B3FD9}
.pillar{border-width:2px;border-color:color-mix(in srgb,var(--pc) 55%,#fff);position:relative;padding-top:18px}
.pillar .num{position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--pc);color:#fff;font-size:11.5px;display:grid;place-items:center;font-weight:700}
.eq-result .res{background:linear-gradient(135deg,#16A34A,#10B981);box-shadow:0 12px 26px -14px #16A34A}

/* journey = roadmap slide */
.journey{gap:18px;padding-top:34px}
.stc{border:1.5px solid color-mix(in srgb,var(--c) 30%,#fff);border-top:5px solid var(--c);border-radius:18px;padding:46px 18px 20px;text-align:center;align-items:center;
 box-shadow:0 22px 40px -28px var(--c),0 0 0 4px color-mix(in srgb,var(--c) 5%,transparent);overflow:visible}
.stc .emo{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;
 background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--c) 55%,#fff),var(--c));box-shadow:0 0 0 5px #fff,0 0 0 7px color-mix(in srgb,var(--c) 22%,#fff),0 10px 24px -8px var(--c)}
.stc .n{position:absolute;top:12px;right:12px}
.stc .n span:first-child{width:26px;height:26px;border-radius:8px;font-size:13px}
.stc .code{display:block;letter-spacing:2.5px;font-size:14px;font-weight:800;margin-top:4px}
.stc h3{font-size:18px;font-weight:800}
.stc .gqc{display:inline-block;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 25%,#fff);border-radius:99px;padding:2px 12px}
.stc .q{font-size:14.5px}
.stc .done{top:auto;bottom:10px;left:50%;transform:translateX(-50%)}

/* section titles */
.sec{text-align:initial}
.sec>h2{font-size:28px;font-weight:800;display:inline-block;position:relative;padding-bottom:12px}
.sec>h2::after{content:"";position:absolute;bottom:0;right:0;width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,#F2994A,var(--acc))}
.sec>.sub{margin-top:10px}

/* labelled cards (deck concept-sheet style) */
.lc{position:relative;border:1.6px solid color-mix(in srgb,var(--k) 55%,#fff);border-radius:16px;padding:30px 20px 18px;
 background:linear-gradient(180deg,color-mix(in srgb,var(--k) 7%,#fff),#fff 70%);box-shadow:0 16px 30px -24px var(--k);font-size:15.5px;line-height:1.85}
.lc-tag{position:absolute;top:-14px;right:18px;max-width:calc(100% - 36px);background:var(--k);color:#fff;font-family:var(--display);font-weight:700;font-size:14px;line-height:1.5;
 padding:4px 14px;border-radius:99px;box-shadow:0 0 0 3px #fff,0 6px 14px -6px var(--k)}
.lc .lc-ic{display:block;text-align:center;font-size:22px;margin-bottom:6px}
.grid:has(> .lc){row-gap:30px;padding-top:14px}
.lcg{display:grid;gap:30px 16px;padding-top:14px}

/* concept cards */
.cc{border:1.6px solid color-mix(in srgb,var(--acc) 30%,#fff);border-radius:18px;box-shadow:0 18px 34px -28px var(--acc)}
.cc .ic{border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--acct));box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 25%,#fff)}
.cc h3{font-weight:800}
.cc .en{display:inline-block;margin-inline-start:6px;border:1.5px solid color-mix(in srgb,var(--acc) 35%,#fff);border-radius:99px;padding:0 10px;font-size:12px;color:var(--acc);background:#fff;font-family:Georgia,"Times New Roman",serif;font-weight:700}
.cc .more{border-top:0;padding-top:6px}
.cc .more .lcg{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:620px){.cc .more .lcg{grid-template-columns:1fr}}
.cc[data-open="1"]{box-shadow:0 26px 50px -30px var(--acc)}

/* stats = glowing metric cards */
.stat{border:2px solid color-mix(in srgb,var(--acc) 50%,#fff);border-radius:20px;text-align:center;padding:22px 16px;background:#fff;
 box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 8%,transparent),0 22px 40px -26px var(--acc)}
.stat .ring{width:104px;height:104px;margin:0 auto 6px;position:relative;display:grid;place-items:center}
.stat .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.stat .ring .v{font-size:26px}
.stat .v{font-family:var(--display);font-weight:800;color:var(--acc)}
.stat:nth-child(2){--acc:#E39A12}.stat:nth-child(3){--acc:#7C3AED}
.stat:nth-child(1){--acc:var(--sacc,#E0314B)}

/* vs */
.vs .lc{height:100%}
.vs .mid{position:relative}
.vs .mid b{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Readex Pro";font-weight:800;font-size:17px;
 background:linear-gradient(135deg,#F43F5E,#F97316);box-shadow:0 0 0 5px #fff,0 0 0 7px #FDE2E4,0 10px 22px -8px #F43F5E}

/* rules */
.rule{background:linear-gradient(180deg,#ECFDF3,#F7FEFA);color:#14532D;border:1.6px solid #86D5A7;border-radius:18px;padding:30px 24px 22px;position:relative;
 justify-content:center;text-align:center;box-shadow:0 18px 34px -26px #16A34A;margin-top:26px}
.rule .ic{position:absolute;top:-14px;right:20px;width:auto;height:auto;background:#16A34A;color:#fff;border-radius:99px;padding:3px 14px;font-size:13.5px;font-family:var(--display);font-weight:700;box-shadow:0 0 0 3px #fff;margin:0}
.rule span:last-child{font-weight:800;font-size:20px;color:#14532D}
.rule small{color:#2F6B45;opacity:1;font-weight:500;margin-top:6px;font-size:14.5px}
.rule.warn{background:linear-gradient(180deg,#FFF1F2,#FFF8F8);border-color:#F4A3AE;box-shadow:0 18px 34px -26px #E11D48}
.rule.warn .ic{background:#E11D48}.rule.warn span:last-child{color:#881337}.rule.warn small{color:#9F3A4C}
.rule.q{background:linear-gradient(135deg,#EEF2FF,#F5F3FF);border-color:#B8B1F7;box-shadow:0 18px 34px -26px #6D28D9}
.rule.q .ic{background:linear-gradient(90deg,#4F46E5,#7C3AED)}.rule.q span:last-child{color:#312E81}.rule.q small{color:#4C4A8A}

/* steps = numbered flow */
.steps{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.step{flex:1 1 170px;flex-direction:column;align-items:center;text-align:center;border:1.6px solid color-mix(in srgb,var(--acc) 40%,#fff);border-radius:16px;
 background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 6%,#fff),#fff);position:relative;padding:18px 14px 16px;box-shadow:0 14px 28px -24px var(--acc)}
.step::before{border-radius:50%;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--acc) 60%,#fff),var(--acc));box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,#fff)}
.step:not(:last-child)::after{content:"←";position:absolute;left:-12px;top:50%;transform:translateY(-50%);color:var(--acc);font-weight:800;font-size:16px;background:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;z-index:1}
@media (max-width:620px){.step:not(:last-child)::after{display:none}}

/* tables = deck header */
.tw{border:1.6px solid color-mix(in srgb,var(--acc) 30%,#fff);border-radius:18px;box-shadow:0 18px 34px -28px var(--acc)}
table.t th{background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#1B2150));color:#fff}
table.t tbody tr:nth-child(odd) td{background:color-mix(in srgb,var(--acc) 4%,#fff)}

/* station head = title slide */
.shead{background:#fff;border:1px solid var(--line);text-align:center;padding:30px 30px 0}
.shead .bignum{display:none}
.shead h1{margin:18px auto 20px;max-width:26ch;font-weight:800}
.shead .gq{display:flex;max-width:none;width:100%;border-radius:18px;padding:18px 22px;align-items:center;gap:16px;text-align:start;
 background:linear-gradient(95deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#7C3AED));box-shadow:0 20px 40px -24px var(--acc)}
.shead .gq span{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);margin:0;padding:4px 12px;border-radius:99px}
.shead .gq p{color:#fff;font-weight:800;font-size:20px}
.shead .gq .qm{font-size:54px;font-family:var(--display);font-weight:800;color:rgba(255,255,255,.28);line-height:1;margin-inline-start:auto}
.shead .toc{justify-content:center;margin:20px 0 18px}
.shead .emo{width:74px;height:74px;border-radius:50%;margin:6px auto 0;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--acc) 50%,#fff),var(--acc));box-shadow:0 0 0 6px #fff,0 0 0 8px color-mix(in srgb,var(--acc) 20%,#fff),0 14px 30px -12px var(--acc)}

/* discussion = "مناقشة" slide */
.disc{border:0;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,var(--acc),#F59E0B) border-box;border:2px solid transparent;border-radius:22px;box-shadow:0 24px 44px -30px var(--acc)}
.disc .ic{border-radius:50%;width:62px;height:62px;font-size:30px;background:radial-gradient(circle at 30% 30%,#fff,var(--acct));box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,#fff)}
.disc .lbl{display:inline-block;background:linear-gradient(90deg,#F43F5E,#F97316);color:#fff;border-radius:99px;padding:2px 12px}
.disc p{font-weight:800}
.timer .tm{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:18px;border:4px solid var(--acct);border-top-color:var(--acc);color:var(--acc)}

/* activity panels */
.act{border:1.6px solid color-mix(in srgb,var(--acc) 30%,#fff);border-radius:22px;box-shadow:0 24px 44px -34px var(--acc)}
.act .ah{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 8%,#fff),#fff);border-bottom:1px dashed color-mix(in srgb,var(--acc) 30%,#fff)}
.act .ah .tag{border-radius:99px;padding:3px 12px;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#7C3AED))}
.act .ah h3{font-weight:800}
.opt{border-radius:14px}
.opt[aria-pressed="true"]{box-shadow:0 10px 22px -16px var(--acc)}
.btn{border-radius:12px}
.btn:not(.ghost){background:linear-gradient(135deg,#2E3A8C,#5B3FD9);border-color:transparent;box-shadow:0 10px 20px -12px #5B3FD9}

/* ladder = staircase slide */
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end;padding-top:30px}
@media (max-width:900px){.ladder{grid-template-columns:1fr;align-items:stretch}.ladder .lv{min-height:0!important}}
.lv{position:relative;border:1.6px solid color-mix(in srgb,var(--c) 30%,#fff);border-top:5px solid var(--c);border-radius:16px;background:#fff;text-align:center;padding:36px 12px 16px;box-shadow:0 20px 36px -26px var(--c)}
.lv .nb{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;box-shadow:0 0 0 4px #fff,0 0 0 6px color-mix(in srgb,var(--c) 25%,#fff)}
.lv .e{font-size:26px;display:block}
.lv .en2{display:block;font-family:"Readex Pro";font-weight:800;letter-spacing:1px;font-size:11.5px;color:var(--c)}
.lv b{display:block;font-family:var(--display);font-weight:800;font-size:17px;margin:2px 0 6px}
.lv b::after{content:"";display:block;width:34px;height:3px;border-radius:3px;background:var(--c);margin:6px auto 0;opacity:.6}
.lv p{font-size:14px;color:var(--muted);margin:0;line-height:1.7}

footer .wrap span:last-child::before{content:"⚖️ "}
/* flip cards: height follows content (no clipping) */
.fl-in{display:grid;height:auto!important;min-height:392px}
.fl-in>.fl-face{position:relative;inset:auto;grid-area:1/1}
.fl-front{min-height:392px}
.fl-back{padding-bottom:4px}
.fl-front::before,.fl-front::after{top:218px}
.fc{display:grid;height:auto!important;min-height:340px}
.fc>.face{position:relative;inset:auto;grid-area:1/1;padding-bottom:48px}

.grid:has(> .cc){align-items:start}
.fl-card{display:flex}.fl-card>.fl-in{flex:1}
.stat{display:flex;flex-direction:column;justify-content:center;align-items:center}
.stat>.v{font-size:44px;line-height:1.2;min-height:104px;display:grid;place-items:center}
@media (max-width:620px){.shead .gq{flex-direction:column;align-items:flex-start;gap:8px}.shead .gq .qm{display:none}.shead .gq p{font-size:18px}.shead .toc{display:none}.hero-frame{padding:28px 18px 6px}}
@media print{.top,footer,.complete,.btn{display:none!important}.view{display:block!important;padding:0}}
</style>

<script>
const STATIONS = [
{ id:'s1', emo:'🧠', n:1, code:'THINK', color:'var(--s1)', tint:'var(--s1t)',
  title:'تشريح القرار: من الحدس إلى ذكاء القرار',
  short:'تشريح القرار',
  gq:'هل المشكلة التي نحاول حلّها... هي المشكلة الصحيحة؟',
  blocks:[

   {t:'stats',items:[['61<small>%</small>','من المديرين أفادوا بأن أكثر من نصف وقت اتخاذ القرار يُهدر'],['20<small>%</small>','فقط من المؤسسات وصفت نفسها بأنها متميزة في صناعة القرار'],['530<small> ألف</small>','يوم عمل إداري يُهدر سنويًا في إحدى شركات Fortune 500 بسبب أوجه القصور في صناعة القرار']]},

   {t:'stats',items:[['9,000','بلاغ صيانة شهريًا'],['6.4<small> أيام</small>','متوسط زمن الإغلاق'],['19<small>%</small>','نسبة إعادة فتح البلاغات']]},

     {ic:'⚖',t:'قرار جيد ≠ نتيجة جيدة',en:'Decision vs Outcome',d:'الحظ لا يجعل القرار الجيد سيئًا... ولا القرار السيئ جيدًا. قرار (أ): دراسة جيدة ← تأجيل ← ارتفاع الأسعار لاحقًا. قرار (ب): قرار متسرع ← ظروف ساعدت ← أرباح.',m:'إذا حكمنا على القرار من النتيجة فقط، فسنتعلم الدرس الخطأ.',p:'السؤال الصحيح عند المراجعة: هل كان هذا القرار منطقيًا استنادًا إلى المعلومات المتاحة لحظة اتخاذه؟ قيّم جودة القرار أولًا... ثم قيّم النتيجة.'},
     {ic:'📢',t:'الضجيج',en:'Noise',d:'اختلاف غير مبرر بين الأحكام المهنية عند التعامل مع الحالة نفسها.',why:'التحيز يمكن اكتشاف اتجاهه، بينما الضجيج قد يبدو مجرد «اختلاف في وجهات النظر».',ex:'البلاغ نفسه عُرض على مشرفين مختلفين، فكانت النتيجة ثلاثة أيام فرق في زمن الاستجابة.',m:'افتراض أن الأتمتة تحل المشكلة؛ فإذا أتمتنا حكمًا غير متسق لم نُزل الضجيج... بل ثبّتناه.',p:'قِس الاختلاف قبل أن تحاول أتمتته.'},
     {ic:'📉',t:'قانون غودهارت',en:"Goodhart's Law",d:'عندما يصبح الرقم هدفًا... يبدأ الناس بتحسين الرقم لا الأداء. عندما يتحول المقياس إلى هدف، قد يتوقف عن كونه مقياسًا جيدًا.',ex:'انخفض زمن إغلاق البلاغات 40%... لكن إعادة الفتح ارتفعت إلى 19%. تحسّن المؤشر، ولم تتحسن الخدمة.',why:'النظام الذكي يستطيع تحسين المؤشر بكفاءة مذهلة... حتى لو كان المؤشر يقيس الشيء الخطأ.',p:'اختبار غودهارت: كيف يمكن تحسين هذا الرقم دون تحسين الخدمة؟ إذا وجدت الإجابة فقد وجدت ثغرة المؤشر. لكل مؤشر مهم... ضع مؤشرًا موازنًا يحمي الغاية.'},

{ id:'s2', emo:'🔍', n:2, code:'CHALLENGE', color:'var(--s2)', tint:'var(--s2t)',

  blocks:[
   {t:'h',id:'s2-open',title:'هل تثق بالذكاء الاصطناعي... لأنه يبدو واثقًا؟',sub:'نظام توصية يعرض عليك: «احتمالية الحالة الخطرة مرتفعة». النص منظم، والتحليل يبدو منطقيًا، والنظام لا يتردد. هل تعتمد التوصية؟'},
   {t:'vs',a:{t:'الثقة في طريقة الإجابة',b:'رقم مرتفع، نص منظم، لغة واثقة، تحليل يبدو منطقيًا.'},b:{t:'صحة الإجابة',b:'أحتاج إلى التحقق، وإلى معرفة كيف وصل النظام إلى النتيجة.'}},
   {t:'rule',text:'أخطر مخرجات الذكاء الاصطناعي ليست الردود السيئة... بل الردود المقنعة والخاطئة.',small:'الإنسان غالبًا يشك في الإجابة الرديئة، لكنه قد يتوقف عن التحقق أمام الإجابة المتقنة.',ic:'!'},
   {t:'h',id:'s2-real',title:'الواقع بالأرقام',sub:'تحقّق خارجي مستقل من نموذج للتنبؤ بالحالات الخطرة الناتجة عن الاستجابة الشديدة للعدوى، شمل 38,455 حالة تنويم، كشف فجوة كبيرة بين «النموذج المستخدم» و«النموذج الموثوق».'},
   {t:'stats',items:[['≈ 0.63','AUC: قدرة تمييز محدودة'],['≈ 33<small>%</small>','الحساسية: ثلثا الحالات لم تُلتقط'],['≈ 12<small>%</small>','القيمة التنبؤية الموجبة: من كل 100 تنبيه']]},
   {t:'boxes',cols:2,items:[
     {t:'ماذا يعني ذلك؟',b:'إذا أصدر النظام تنبيهًا، فإن نحو 12% فقط من الحالات التي صنّفها إيجابية كانت صحيحة فعليًا؛ أي أن معظم التنبيهات تحتاج إلى مراجعة بشرية قبل اتخاذ الإجراء.'},
     {t:'المفاجأة الحقيقية: توقيت الثقة',b:'كان النموذج قيد الاستخدام قبل أن يكتمل التحقق المستقل من أدائه خارج الجهة المطوّرة. هل يكفي أن يقول المورّد إن النموذج «تم التحقق منه»؟ أين؟ وعلى أي بيانات؟ ومتى؟',tint:1}
   ]},
   {t:'steps',title:'سلسلة الأسئلة الحاكمة',items:[['هل الذكاء الاصطناعي دقيق؟','دقيق... بالنسبة إلى ماذا؟'],['دقيق على أي بيانات؟','وفي أي سياق؟'],['ما تكلفة الخطأ؟','ومن يتضرر منه؟'],['ماذا لا يعرف النظام؟','حدود معرفته ونطاق بياناته'],['من يملك حق رفض توصيته؟','المسؤولية والصلاحية']]},
   {t:'rule',text:'الذكاء الاصطناعي لا يحتاج إلى أن يكون صحيحًا دائمًا حتى يؤثر في القرار؛ يكفي أن يكون مقنعًا بما يكفي لكي نتوقف عن التحقق.',ic:'◆'},
   {t:'h',id:'s2-traps',title:'ستة أسئلة... ستة فخاخ',sub:'قبل أن تعتمد توصية الذكاء الاصطناعي، مرّ على هذه الفخاخ الستة.'},
   {t:'cards',items:[
     {ic:'🤖',t:'تحيّز الأتمتة',en:'Automation Bias',d:'الميل إلى قبول مخرجات الأنظمة الآلية دون تحقق كافٍ، ويظهر في صورتين: أخطاء الإغفال (عدم ملاحظة ما أغفله النظام) وأخطاء الارتكاب (اتباع توصية آلية خاطئة).',why:'قد يدفعك إلى تفويض الحكم للنظام دون قصد، خاصة تحت ضغط الوقت أو عند ارتفاع الثقة بالنظام.',ex:'يقترح النظام أولوية لبلاغ معين، فيتبع المسؤول التوصية مباشرة دون تكوين حكم مستقل.',m:'الاعتقاد أن معرفة وجود تحيّز الأتمتة تكفي لتجنبه.',p:'سجّل تقييمك الأولي قبل الاطلاع على مخرجات النظام، ثم قارن الحكمين، ودوّن سبب أي تغيير في حكمك.',q:'هل تحققت من التوصية؟'},
     {ic:'🌀',t:'الهلوسة',en:'Hallucination',d:'إنتاج محتوى يبدو متماسكًا ومقنعًا لكنه غير صحيح أو غير مستند إلى مصدر موثوق.',why:'المعلومة الخاطئة قد تبدو مهنية ودقيقة، مما يزيد احتمال اعتمادها دون تحقق.',ex:'مرجع نظامي برقم مادة دقيق... لكنه غير موجود.',m:'الاعتماد على الخبرة أو الانطباع الشخصي لاكتشاف الهلوسة.',p:'لا مرجع ولا إحصائية دون مصدر موثوق يمكن الرجوع إليه.',q:'هل تحققت من المصدر؟'},
     {ic:'🌍',t:'انحراف البيانات والنموذج',en:'Data & Model Drift',d:'انحراف البيانات: تغيّر خصائص البيانات المستخدمة في النظام. انحراف النموذج: تغيّر العلاقة بين المدخلات والمخرجات بعد بدء التشغيل. النموذج لم يتغيّر... لكن العالم تغيّر.',why:'قد يتدهور أداء النموذج بمرور الوقت حتى دون إجراء أي تعديل عليه.',ex:'نموذج لترتيب أولويات الخدمات دُرّب قبل التوسّع العمراني، ثم ظهرت أحياء جديدة لم تكن ممثلة جيدًا في بيانات التدريب.',m:'اعتبار اختبار النموذج عند إطلاقه أو شرائه ضمانًا مستمرًا لأدائه.',p:'حدّد حدود أداء واضحة وراقب الأداء دوريًا.',q:'هل ما زال النموذج مناسبًا للواقع الحالي؟'},
     {ic:'🔗',t:'الارتباط ≠ السببية',en:'Correlation vs Causation',d:'الارتباط يوضّح وجود علاقة بين متغيرين، لكنه لا يثبت أن أحدهما سبب للآخر.',why:'بناء القرار على علاقة ارتباطية فقط قد يؤدي إلى تدخلات غير فعّالة أو مكلفة.',ex:'ارتفاع البلاغات مرتبط بزيادة زيارات فرق الصيانة؛ لكن الزيارات لا تسبب البلاغات، فقد تكون نتيجة لاكتشاف مزيد من الأعطال.',m:'تحويل علاقة ارتباطية إلى توصية سببية.',p:'اسأل: هل الدليل ارتباطي أم سببي؟ وإذا كانت التوصية سببية، ما الدليل أو التجربة التي تثبت أن التدخل سيُحدث الأثر المتوقع؟',q:'هل العلاقة تثبت السببية؟'},
     {ic:'📊',t:'مغالطة المعدل الأساسي',en:'Base Rate Fallacy',d:'تجاهل معدل حدوث الحدث الأساسي عند تفسير نتائج النموذج.',why:'انخفاض معدل حدوث الحدث قد يؤدي إلى انخفاض القيمة التنبؤية الموجبة حتى مع ارتفاع الحساسية والنوعية.',ex:'معدل حدوث 3%، حساسية 80%، نوعية 90%: نحو 20 فقط من كل 100 إنذار ستكون صحيحة (قرابة الخُمس).',m:'الاعتماد على رقم الدقة الوارد في عرض النظام دون التحقق من معدل حدوث الحدث في بيئة التشغيل الفعلية.',p:'اسأل: كم يحدث الحدث فعليًا لدينا؟ كم إنذارًا سيولّد النظام؟ وكم منها سيكون صحيحًا؟',q:'كم يحدث الحدث فعليًا؟'},
     {ic:'🎭',t:'المتغيّر البديل',en:'Proxy Variable',d:'استخدام متغير قابل للقياس بوصفه مؤشرًا بديلًا عن متغير آخر يصعب قياسه مباشرة.',why:'قد يؤدي إلى تحيّز غير مقصود عندما يعكس خصائص لا علاقة لها بالهدف الحقيقي للقرار.',ex:'إذا قيست الأولوية بحدّة لغة البلاغ، تصبح الأولوية للبلاغات الأكثر انفعالًا بدلًا من البلاغات الأكثر حاجة.',m:'افتراض أن المتغير القابل للقياس يمثّل الهدف الحقيقي.',p:'اطلب تحديد جميع المتغيرات البديلة المستخدمة، ومبررات استخدامها، ومخاطرها المحتملة. غياب هذه المعلومات مؤشر يستدعي مزيدًا من التحقق.',q:'هل المتغير يقيس ما أعتقد أنه يقيسه؟'}
   ]},
   {t:'act',id:'baserate'},
   {t:'h',id:'s2-think',title:'كيف «يفكر» الذكاء الاصطناعي؟',sub:'قد يعطيك الذكاء الاصطناعي إجابة ممتازة... دون أن «يفهم» ما قاله. ليس كل ذكاء اصطناعي يعمل بالطريقة نفسها: أربعة أنظمة، أربعة أنواع من المخاطر.'},
   {t:'table',head:['النظام','ماذا يفعل؟','السؤال الذي يهمّك'],rows:[
     ['<b>التعلم الآلي الإشرافي</b>','يتعلّم من بيانات تاريخية ونتائج معروفة','هل تعلّم النمط الصحيح... أم تعلّم تحيزات الماضي؟'],
     ['<b>النماذج اللغوية</b>','تتنبأ بالتتابع الأكثر احتمالًا من الرموز؛ تختار الأعلى احتمالًا لا الأصح بالضرورة','هل المخرج صحيح، أم مقنع فقط؟'],
     ['<b>أنظمة التوصية</b>','تحسّن مؤشرًا أو هدفًا محددًا (النقرات، التفاعل، مدة الاستخدام)','ما الذي صُمم النظام لتحسينه فعلًا؟'],
     ['<b>وكلاء الذكاء الاصطناعي</b>','تنفذ خطوات وإجراءات باستخدام الأدوات؛ كل خطوة تُوسّع سطح الأثر في الواقع','ماذا يستطيع النظام أن يفعل؟ وما حدود صلاحياته؟']]},
   {t:'boxes',cols:2,items:[
     {t:'حلقة التحيّز في التعلم الإشرافي',b:'قرارات تاريخية تحمل تحيزًا ← النموذج يتعلم النمط ويعيد إنتاجه ← قرارات جديدة غير عادلة ← تُغذّي البيانات التاريخية... وتدور الحلقة.'},
     {t:'النمط ليس سببًا',b:'قد يكتشف الذكاء الاصطناعي ارتباطًا قويًا. لكن من النمط إلى التنبؤ خطوة، ومن التنبؤ إلى التفسير خطوة أخرى. السؤال الحاسم: هل ما اكتشفه النموذج مجرد نمط... أم دليل على سبب؟',tint:1}
   ]},
   {t:'act',id:'capmap'},
   {t:'boxes',cols:2,items:[
     {t:'تجربة حيّة: هل يعطي الذكاء الاصطناعي الإجابة نفسها دائمًا؟',b:'اطرح السؤال ذاته على نظامين (أو على النظام نفسه مرتين)، ثم قارن: أيهما كان أكثر إقناعًا؟ هل الأكثر إقناعًا هو الأكثر صحة؟ ما مستوى الثقة الذي أعطاه كل نموذج؟ ما الذي اختلف وما الذي اتفق؟'},
     {t:'الرسالة الأساسية',b:'قد تتأثر المخرجات بصياغة السؤال والمعلومات المتاحة. اختلاف المخرجات ليس مشكلة يجب إخفاؤها؛ بل فرصة لفهم حدود النموذج وضرورة التحقق من مخرجاته.',tint:1}
   ]},
   {t:'h',id:'s2-trap',title:'تجربة «فخ الذكاء الاصطناعي»',sub:'هل تثق بقرارك... أم تثق بما يقوله الذكاء الاصطناعي؟ ثلاث جولات وقرار واحد. لا توجد إجابة صحيحة أو خاطئة؛ المطلوب أن تلاحظ ما يحدث لقرارك عندما تظهر توصية آلية.'},
   {t:'act',id:'trap'},
   {t:'boxes',cols:2,items:[
     {t:'يزداد أثر تحيّز الأتمتة عندما...',b:'يكون الوقت محدودًا لاتخاذ القرار، وتنخفض القدرة على التحقق المستقل. الخطر الحقيقي ليس في وجود الذكاء الاصطناعي... بل في تفويض الحكم له دون قصد.'},
     {t:'قاعدة عملية: الإنسان أولًا... ثم الآلة',b:'لا تجعل الآلة تقرر أولًا ثم تجعل الإنسان يوافق. التوصية الآلية مُدخَل للقرار، وليست القرار.',tint:1}
   ]},
   {t:'act',id:'verify7'},
   {t:'disc',q:'أيّ الأخطاء الثلاثة المتكررة (الخلط بين جودة القرار وجودة النتيجة، الضجيج، تحيّز الأتمتة) يكون الأكبر خطورة عندما يصبح الذكاء الاصطناعي جزءًا من عملية اتخاذ القرار؟',ins:'الأخطر هو تحيّز الأتمتة، لأنه الخطأ الذي يُعطّل مناعة المؤسسة ضد بقية الأخطاء. أولًا عامل السرعة والنطاق: خطأ النظام يتكرر على آلاف الحالات بالنمط نفسه خلال ثوانٍ فيتحول الخطأ الفردي إلى خطأ مؤسسي ممنهج. ثانيًا تعطيل خط الدفاع الأخير: حين يفقد المراجع البشري دافع الاعتراض لا يبقى من يكتشف الخطأين الآخرين. ولاحظ أن الذكاء الاصطناعي يخفف الضجيج لأنه متسق مع نفسه، لكن هذا الاتساق خادع؛ فالنظام المتسق قد يكون متسقًا في الخطأ.'},
   {t:'rule',text:'الثقة لا تُمنح للآلة... بل تُبنى بالتحقق.',small:'قوة الذكاء الاصطناعي في قدرته على توسيع التفكير؛ وقوة صانع القرار في قدرته على مساءلة ما تنتجه الآلة.',ic:'✓'}
  ]},

  blocks:[
   {t:'h',id:'s3-open',title:'ماذا لو كان أفضل استخدام للذكاء الاصطناعي... ألّا تسأله عن القرار؟',sub:'غالبًا نبدأ بسؤال «ما أفضل قرار؟»، لكن الاستخدام الأكثر قيمة يبدأ بأسئلة مختلفة. الهدف ليس أن يقرر عنك، بل أن يجعلك تفكر بصورة أفضل.'},
   {t:'boxes',cols:4,items:[{t:'«ما البدائل التي لم أفكّر فيها؟»',b:''},{t:'«ما الافتراض الذي قد يكون خاطئًا؟»',b:''},{t:'«كيف يمكن أن يفشل هذا القرار؟»',b:''},{t:'«ما الحجة الأقوى ضد قراري؟»',b:''}]},
   {t:'act',id:'reframe'},
   {t:'h',id:'s3-roles',title:'لا تطلب منه الإجابة... اطلب منه أن يعارضك',sub:'يمكن استخدام الذكاء الاصطناعي في ستة أدوار محددة تُوسّع مساحة التفكير قبل القرار.'},
   {t:'boxes',cols:3,items:[
     {t:'توليد البدائل',b:'اكتشاف خيارات لم تكن مطروحة.'},{t:'اختبار الافتراضات',b:'كشف الافتراضات التي بُني عليها القرار.'},{t:'وجهة النظر المعارضة',b:'بناء أقوى حجة ضد الخيار المطروح.'},
     {t:'محاكاة السيناريوهات',b:'استكشاف ما قد يحدث إذا تغيّرت الظروف.'},{t:'تحليل ما قبل الوفاة',b:'افترض أن القرار فشل... لماذا فشل؟'},{t:'الفريق الأحمر',b:'اجعله يتصرف كفريق معارض يبحث عن نقاط الضعف.'}]},
   {t:'vs',a:{t:'الاستخدام التقليدي',b:'«أي نموذج ذكاء اصطناعي تنصحنا به لترتيب البلاغات؟» إجابة تقنية ممتازة... لكن هل طرحتَ السؤال الصحيح؟'},b:{t:'استخدامه مساعدًا للقرار',b:'اقترح 5 معايير مختلفة لتحديد أولوية البلاغ. حدّد الافتراضات الخفية وراء كل معيار. ابحث عن الحالات التي قد يفشل فيها كل معيار. قدّم أقوى حجة ضد استخدام النموذج. «افترض أن المشروع فشل بعد سنة؛ ما الأسباب المحتملة؟»'}},
   {t:'rule',text:'الذكاء الاصطناعي لا يجب أن يُغلق مساحة التفكير... بل أن يوسّعها.',small:'توسيع البدائل ← اختبار الافتراضات ← استكشاف المخاطر ← محاكاة السيناريوهات ← سماع الرأي المعارض ← ثم اتخاذ القرار',ic:'↔'},
   {t:'h',id:'s3-concepts',title:'المفاهيم الأساسية',sub:'خمسة مفاهيم تحوّل أداة الذكاء الاصطناعي إلى منظومة قرار.'},
   {t:'cards',items:[
     {ic:'🧭',t:'مساعد القرار',en:'Decision Copilot',d:'منظومة تفكير منظمة تُستخدم لدعم قرار محدد، وتقوم على أربعة أركان: مدخلات واضحة، ونطاق استخدام محدد، ووظائف ومعايير قبول، ومخرجات موحّدة قابلة للمراجعة.',why:'تحويل الاستخدام من محادثة مفتوحة إلى منظومة منظمة يجعل المخرجات أكثر اتساقًا وقابلية للمراجعة والتطوير.',ex:'مساعد لترتيب أولويات البلاغات التشغيلية ضمن نطاق محدد، يقدّم توصية وفق معايير معلنة، مع درجة الثقة ومواطن عدم اليقين.',m:'إنشاء مساعد عام دون نطاق واضح، فيُستخدم في قرارات لم يُصمّم لدعمها.',p:'ابدأ بنوع واحد من القرارات المتكررة، وحدّد النطاق والمدخلات والوظائف والمخرجات وضوابط الاستخدام قبل تشغيله.'},
     {ic:'⚰',t:'تحليل ما قبل الوفاة',en:'Pre-mortem',d:'أسلوب تحليلي يفترض أن القرار قد فشل بالفعل، ثم يبحث الفريق بأثر رجعي عن أسباب الفشل المحتملة، قبل تنفيذ القرار.',why:'يكشف المخاطر ونقاط الضعف مبكرًا، ويجعل طرح المخاطر جزءًا من منهجية العمل بدل أن يُنظر إليه كاعتراض شخصي.',ex:'أحد المخاطر: تحوّل القاعدة التشغيلية إلى إجراء شكلي، فتُصنّف جميع الحالات «عاجلة» لتجنب التأخير.',m:'إجراؤه بعد اعتماد القرار، فيتحول من أداة استباقية إلى محاولة لتبرير القرار.',p:'«إذا فشل هذا القرار بعد ستة أشهر، فما السبب الأكثر احتمالًا؟» حدّد: أسبابًا محتملة للفشل، ومؤشرات إنذار مبكر، وإجراءات وقائية.'},
     {ic:'🟥',t:'الفريق الأحمر',en:'Red Teaming',d:'تكليف مستقل ومنهجي لفريق بمهاجمة القرار أو النظام لاكتشاف نقاط الضعف والثغرات ومصادر الفشل المحتملة قبل التنفيذ. مهمتك ليست الدفاع عن القرار... بل محاولة إسقاطه.',why:'مراجعة القرار من منظور مؤيد له قد لا تكشف نقاط ضعفه، بينما يوفر الفريق الأحمر منظورًا نقديًا مستقلًا يختبر متانته.',ex:'أُسند إلى فريق مستقل دور «المعارض» فقدّم 5 حجج مضادة؛ أدّت اثنتان منها إلى تعديل القرار قبل تنفيذه.',m:'تحويله إلى جلسة انتقاد عامة تنتج قائمة طويلة من المخاوف دون إجراءات واضحة.',p:'كل اعتراض ينتهي بنتيجة قابلة للتنفيذ، أو بتوثيق سبب رفضه.'},
     {ic:'🧾',t:'توثيق المصدر',en:'Provenance',d:'توثيق مصدر كل عنصر في عملية القرار: ما أنتجه الذكاء الاصطناعي، وما أضافه أو عدّله الإنسان، ومتى تمّ ذلك، بما يتيح تتبّع مسار القرار من المصدر إلى المخرج النهائي.',m:'دمج مخرجات الذكاء الاصطناعي مباشرة في الوثيقة النهائية دون توثيق مصدرها، فيصعب تتبّع أصل المعلومات لاحقًا.',p:'إذا لم تستطع تتبّع مصدر القرار، فسيصبح من الصعب مساءلته أو التعلّم منه.'},
     {ic:'🎭',t:'تقنيع البيانات',en:'Data Masking',d:'استبدال البيانات الحساسة أو القابلة للتعرّف بقيم بديلة تحافظ على البنية التحليلية وتحدّ من إمكانية تحديد هوية الأفراد أو الجهات. مثال: «حي الشفا» ← «حي (أ)»، ورقم الهوية ← معرّف عشوائي، مع الاحتفاظ بالبيانات الإحصائية اللازمة.',why:'يتيح الاستفادة من أدوات الذكاء الاصطناعي مع تقليل مخاطر كشف البيانات، ودعم الالتزام بمتطلبات حماية البيانات الشخصية.',m:'حذف الاسم فقط مع الإبقاء على تفاصيل يمكن دمجها مع مصادر أخرى وإعادة تحديد الهوية. إخفاء الاسم لا يعني بالضرورة إخفاء الهوية.',p:'اجعل التقنيع خطوة إلزامية قبل إدخال أي بيانات حساسة، وضمّنها في إجراءات العمل وقوالب الصياغة المعتمدة.'}
   ]},
   {t:'act',id:'copilot9'},
   {t:'h',id:'s3-functions',title:'ست وظائف قرارية للذكاء الاصطناعي',sub:'إذا لم تطلب من الذكاء الاصطناعي «قرارًا»... فماذا تطلب منه؟ لكل وظيفة صياغة ومعيار قبول؛ والمخرج الذي لا يجتاز معيار القبول لا يُعتمد.'},
   {t:'table',head:['الوظيفة','ماذا تطلب؟','معيار القبول'],rows:[

     ['<b>2. توليد البدائل</b>','«ولّد بدائل متمايزة فعليًا، وليس صياغات مختلفة للبديل نفسه»','بديل واحد قابل للتنفيذ لم يكن مطروحًا أصلًا. التمايز في الجوهر... لا في الصياغة.'],
     ['<b>3. تحليل السيناريوهات</b>','«ماذا يحدث للقرار إذا تغيّرت الظروف؟» لا «ماذا سيحدث؟» فقط','أن يحدّد النظام الافتراض الذي إذا سقط... انهار القرار.'],
     ['<b>4. كشف المخاطر</b>','ترتيب المخاطر حسب الاحتمال والأثر ومؤشر الإنذار','كل خطر يرتبط بمؤشر يمكن رصده فعلًا في بياناتنا.'],
     ['<b>5. اختبار الافتراضات</b>','«افصل المثبَت عن المفترَض في نص القرار»','قائمة افتراضات صريحة. ما لا نراه كافتراض قد يصبح نقطة انهيار.'],
     ['<b>6. الحجج المضادة</b>','«قدّم أقوى حجة ضد القرار المفضّل»','أن تكون الحجة قوية لدرجة تستحق ردًا مكتوبًا... لا تجاهلًا.']]},
   {t:'boxes',cols:1,items:[{t:'أشياء لا تُطلب من النظام إطلاقًا',b:'الترجيح النهائي بين البدائل، وتقدير كلفة داخلية لا يعرفها، وأي حكم يتطلب معرفة بسياسات الجهة غير المتاحة له.',tint:1}]},
   {t:'h',id:'s3-prompt',title:'هندسة الحوار من أجل القرار',sub:'هل المشكلة في الذكاء الاصطناعي؟ أم في طريقة الحديث معه؟ الصياغة الضعيفة «حلّل هذا القرار وأعطني رأيك» بلا دور ولا سياق ولا معيار ولا شكل للمخرج.'},
   {t:'act',id:'prompt'},
   {t:'boxes',cols:2,items:[
     {t:'لا تترك النظام «حرًّا»: قيود حماية إلزامية',b:'حدّد ما لا يعرفه النظام، واطلب منه الفصل بين ما هو مثبت وما هو مفترض، وألّا يقدّم أرقامًا أو مراجع دون مصدر. المخرج الجيد لا يخبرك فقط بما يعرفه النظام؛ بل يكشف أيضًا حدود معرفته.'},
     {t:'مكتبة الصياغات المعتمدة',b:'احفظ الصياغة التي نجحت في مكتبة الإدارة: تلك التي أعطت أوضح مخرج وأفضل تفكير. الصياغة الجيدة لا تبقى في رأس الموظف... بل تتحول إلى أصل مؤسسي قابل لإعادة الاستخدام.',tint:1}
   ]},
   {t:'disc',q:'ما هو السؤال الأفضل لتغيير دور الذكاء الاصطناعي: «أعطني أفضل قرار»، أم «لخّص لي المعلومات»، أم «أي خيار أختار؟»',ins:'لا شيء منها. الأسئلة الثلاثة تُبقي الذكاء الاصطناعي في دور «المجيب». الأفضل: «اختبر قراري»، «اكشف افتراضاتي»، «ما مخاطر كل خيار؟»، «قدّم لي حجة معارضة». ويمكن تطبيق ذلك بخمسة وكلاء يعارض بعضهم بعضًا وينتقد كل منهم الآخر.'},
   {t:'rule',text:'لا تجعل الذكاء الاصطناعي يتخذ القرار بدلًا منك... بل اجعله يوسّع خياراتك، ويتحدّى افتراضاتك، ويبحث عن نقاط ضعفك، ويحاكي الفشل، ويوثّق مسار القرار، ويحمي بياناتك. ثم أنت تقرر.',ic:'◎'}
  ]},

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const store={get(k,d){try{const v=localStorage.getItem('dm28:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('dm28:'+k,JSON.stringify(v))}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200)}
function copyText(txt){ if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast('تم النسخ'),()=>fallbackCopy(txt))} else fallbackCopy(txt)}
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('تم النسخ')}catch(e){toast('تعذر النسخ')}ta.remove()}
const stColor=n=>n? `var(--s${n})`:'var(--wisdom)';
const stTint=n=>n? `var(--s${n}t)`:'#EEF0FA';
function setAcc(el,n){el.style.setProperty('--acc',stColor(n));el.style.setProperty('--acct',stTint(n))}

const VIEWS=[
 {id:'home',label:'الرئيسية'},
 ...STATIONS.map(s=>({id:s.id,label:s.short,n:s.n})),
 {sep:1},
 {id:'lab',label:'مختبر الأنشطة',ic:'🧪'},

function done(){return store.get('done',{})}
function renderTabs(){
  const d=done();
  $('#tabs').innerHTML=VIEWS.map(v=>v.sep?'<span class="sep" aria-hidden="true"></span>':
   `<a class="tab" href="#${v.id}" data-v="${v.id}">${v.n?`<span class="d" style="background:${stColor(v.n)}"></span>${AR(v.n)}. `:(v.ic?`<span aria-hidden="true">${v.ic}</span>`:'')}${v.label}${v.n&&d[v.id]?'<span class="chk" aria-label="مكتملة">✔</span>':''}</a>`).join('');
  const c=Object.keys(d).filter(k=>d[k]).length;
  $('#progTxt').textContent=`${AR(c)} من ${AR(5)} محطات`;
  $('#progBar').style.width=(c/5*100)+'%';
}
const main=$('#main');
function route(){
  const h=(location.hash||'#home').slice(1).split('/');
  const id=VIEWS.find(v=>v.id===h[0])?h[0]:'home';
  let el=$('#v-'+id);
  if(!el){el=document.createElement('section');el.className='view';el.id='v-'+id;main.appendChild(el);BUILD[id]?BUILD[id](el):buildStation(el,STATIONS.find(s=>s.id===id))}
  $$('.view').forEach(v=>v.classList.toggle('on',v===el));
  $$('.tab').forEach(t=>{if(t.dataset.v===id)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
  const at=$('.tab[aria-current]');at&&at.scrollIntoView({block:'nearest',inline:'center'});
  document.title=(id==='home'?'':(VIEWS.find(v=>v.id===id).label+' · '))+'بين الحكمة والجرأة';
  if(h[1]){const t=document.getElementById(h[1]);if(t){setTimeout(()=>t.scrollIntoView({behavior:'smooth',block:'start'}),60);return}}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

let discN=0;
function discHTML(q,ins,n){const id='disc'+(discN++);return `<div class="disc" style="--acc:${stColor(n)};--acct:${stTint(n)}"><span class="ic" aria-hidden="true">🤖</span><div><span class="lbl">مناقشة</span><p>${q}</p></div><div class="timer"><span class="tm" id="${id}t">٥:٠٠</span><button class="btn sm" data-timer="${id}">ابدأ المؤقت</button>${ins?`<button class="btn sm ghost" data-ins="${id}">فكرة للنقاش</button>`:''}</div>${ins?`<div class="ins" id="${id}i">${ins}</div>`:''}</div>`}
const timers={};
function bindDisc(root){
 $$('[data-timer]',root).forEach(b=>b.onclick=()=>{const id=b.dataset.timer,t=$('#'+id+'t');
   if(timers[id]){clearInterval(timers[id].h);delete timers[id];b.textContent='ابدأ المؤقت';return}
   let s=300;timers[id]={h:setInterval(()=>{s--;t.textContent=AR(Math.floor(s/60)+':'+String(s%60).padStart(2,'0'));if(s<=0){clearInterval(timers[id].h);delete timers[id];b.textContent='ابدأ المؤقت';toast('انتهى وقت النقاش')}},1000)};b.textContent='إيقاف'});
 $$('[data-ins]',root).forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.ins+'i');i.classList.toggle('on');b.textContent=i.classList.contains('on')?'إخفاء':'فكرة للنقاش'});
}

}

const lc=(k,tag,body,ic)=>`<div class="lc" style="--k:${k}"><span class="lc-tag">${tag}</span>${ic?`<span class="lc-ic" aria-hidden="true">${ic}</span>`:''}${body}</div>`;
function statHTML(i){const raw=i[0].replace(/<[^>]+>/g,'');const m=raw.match(/^≈?\s*([\d.]+)\s*%$/);let v=`<div class="v num">${i[0]}</div>`;
 if(m){const n=Math.min(100,parseFloat(m[1])),C=2*Math.PI*44;v=`<div class="ring"><svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="color-mix(in srgb,var(--acc) 15%,#fff)" stroke-width="9"/><circle cx="52" cy="52" r="44" fill="none" stroke="var(--acc)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*n/100} ${C}"/></svg><div class="v num">${i[0]}</div></div>`}
 return `<div class="stat">${v}<p>${i[1]}</p></div>`}
function blockHTML(b,s){
 switch(b.t){
  case 'stats':return `<div class="stats" style="--sacc:${stColor(s.n)}">${b.items.map(statHTML).join('')}</div>`;
  case 'rule':{const ic=b.ic||'◆';const kind=['⚠','!'].includes(ic)?'warn':ic==='?'?'q':'';const lab={'⚠':'تنبيه','!':'تنبيه','?':'السؤال الجوهري','★':'الخلاصة','💡':'اكتشاف','■':'قاعدة حاكمة'}[ic]||'قاعدة';
   return `<div class="rule ${kind}"><span class="ic">${lab}</span><span>${b.text}${b.small?`<small>${b.small}</small>`:''}</span></div>`}
  case 'cards':return `<div class="grid g2">${b.items.map(c=>`<article class="cc" data-open="0"><button aria-expanded="false"><span class="ic" aria-hidden="true">${c.ic}</span><span><h3>${c.t} <span class="en">${c.en}</span></h3><span class="d">${c.d}</span></span><span class="ar" aria-hidden="true">▾</span></button><div class="more"><div class="lcg">${c.why?lc('#3B6FE0','لماذا يهمّ صانع القرار؟',c.why):''}${c.ex?lc('#E39A12','في الحالة الجارية',c.ex):''}${c.m?lc('#E0314B','الخطأ الشائع',c.m):''}${c.p?lc('#16A34A','كيف تستخدمه عمليًا؟',c.p):''}${c.q?lc('#7C3AED','سؤال الفحص',c.q):''}</div></div></article>`).join('')}</div>`;
  case 'vs':return `<div class="vs" style="padding-top:14px">${lc('#3B6FE0',b.a.t,b.a.b)}<div class="mid"><b>VS</b></div>${lc('#E0314B',b.b.t,b.b.b)}</div>`;
  case 'boxes':return `<div class="lcg" style="grid-template-columns:repeat(${Math.min(b.cols,4)},minmax(0,1fr))">${b.items.map((i,k)=>lc(PAL[(k+s.n)%PAL.length],i.t,i.b||'')).join('')}</div>`;
  case 'steps':return `${b.title?`<h3 style="font-size:19px;margin-bottom:12px">${b.title}</h3>`:''}<div class="steps">${b.items.map(i=>`<div class="step"><div><b>${i[0]}</b><span>${i[1]}</span></div></div>`).join('')}</div>`;
  case 'table':return `<div class="tw"><table class="t"><thead><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  case 'disc':return discHTML(b.q,b.ins,s.n);
  case 'act':{const a=ACTS[b.id];return a?`<div class="act" id="act-${b.id}" data-act="${b.id}"><div class="ah"><span class="tag">${a.tag}</span><h3>${a.title}</h3></div><div class="ab"></div></div>`:''}
 }
 return '';
}

const ACTS={};
const B=r=>$('.ab',r);
function chipsSorter(root,items,cats,key,doneMsg){
 const st=store.get(key,{});
 B(root).innerHTML=`<div class="sorter">${items.map((it,i)=>`<div class="item"><span>${it[0]}</span><div class="chips" data-i="${i}">${cats.map((c,j)=>`<button class="chip" data-j="${j}" aria-pressed="false">${c}</button>`).join('')}</div></div>`).join('')}</div>
 <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn sm" data-chk>تحقّق من إجاباتي</button><button class="btn sm ghost" data-rst>إعادة</button></div><div class="fb"></div>`;
 const paint=(check)=>{$$('.chips',root).forEach(g=>{const i=+g.dataset.i;$$('.chip',g).forEach(c=>{const j=+c.dataset.j;c.classList.remove('ok','no');c.setAttribute('aria-pressed',st[i]===j);if(check&&st[i]===j)c.classList.add(j===items[i][1]?'ok':'no');if(check&&st[i]!==j&&j===items[i][1]&&st[i]!=null)c.classList.add('ok')})})};
 $$('.chip',root).forEach(c=>c.onclick=()=>{st[+c.parentElement.dataset.i]=+c.dataset.j;store.set(key,st);paint(false);$('.fb',root).className='fb'});
 $('[data-chk]',root).onclick=()=>{paint(true);const n=items.filter((it,i)=>st[i]===it[1]).length,a=Object.keys(st).length;const fb=$('.fb',root);fb.className='fb on '+(n===items.length?'good':'warn');fb.innerHTML=(a<items.length?`صنّفت ${AR(a)} من ${AR(items.length)}. `:'')+`إجاباتك الصحيحة: ${AR(n)} من ${AR(items.length)}. `+(n===items.length?doneMsg:(items.some(it=>it[2])?'<br>'+items.map((it,i)=>st[i]!==it[1]&&it[2]?`• ${it[2]}`:'').filter(Boolean).join('<br>'):''))};
 $('[data-rst]',root).onclick=()=>{for(const k in st)delete st[k];store.set(key,st);paint(false);$('.fb',root).className='fb'};
 paint(false);
}

ACTS.baserate={tag:'حاسبة تفاعلية',title:'مغالطة المعدل الأساسي: كم إنذارًا صحيحًا من كل ١٠٠؟',init(r){
 B(r).innerHTML=`<div class="grid g2" style="align-items:center"><div>

 <div><div class="dots" data-d aria-hidden="true"></div><div class="legend"><span><i style="background:var(--s5)"></i>إنذار صحيح</span><span><i style="background:#F4B6BF"></i>إنذار خاطئ</span><span>من كل ١٠٠ إنذار</span></div></div></div>`;
 const [a,b,c]=['#br1','#br2','#br3'].map(s=>$(s,r));
 const upd=()=>{const p=a.value/100,se=b.value/100,sp=c.value/100;const tp=p*se,fp=(1-p)*(1-sp);const ppv=tp/(tp+fp);const k=Math.round(ppv*100);
  $$('output',r).forEach((o,i)=>o.textContent=AR([a,b,c][i].value)+'%');
  $('[data-d]',r).innerHTML=Array.from({length:100},(_,i)=>`<i class="${i<k?'tp':'fp'}"></i>`).join('');
  const per=10000,alerts=Math.round(per*(tp+fp)),missed=Math.round(per*p*(1-se));
  $('[data-o]',r).innerHTML=`من كل ١٠٠ إنذار يصدره النظام، نحو <b class="num" style="font-size:24px;color:var(--ok)">${AR(k)}</b> فقط صحيحة فعلًا (القيمة التنبؤية الموجبة ${AR((ppv*100).toFixed(1))}%).<br><span class="muted">في كل ${AR('10,000')} حالة: سيصدر نحو ${AR(alerts.toLocaleString('en'))} إنذار، وستفوت ${AR(missed)} حالة حقيقية.</span>`};
 [a,b,c].forEach(x=>x.oninput=upd);$('[data-p]',r).onclick=()=>{a.value=3;b.value=80;c.value=90;upd()};upd();
