 const O=['قرار قابل للتراجع مع نقطة مراجعة','تفويض القرار إلى الذكاء الاصطناعي','انتظار اكتمال المعلومات','اتخاذ القرار فورًا'];
 B(r).innerHTML=`${sv.v!=null?`<div class="fb info on" style="margin:0 0 14px">موقفك في بداية المحطة كان: <b>${O[sv.v]}</b>. هل تغيّر الآن؟</div>`:''}<div class="fld"><label>قرارك</label><input type="text" data-k="t" placeholder="اكتب القرار الذي تعمل عليه"></div>${Q.map((q,i)=>`<div class="fld"><label>${AR(i+1)}. ${q}</label><textarea rows="2" data-k="${i}"></textarea></div>`).join('')}<div class="fb on" data-f></div><div class="fld" style="margin-top:12px"><label>التزامك<small>«سأعرف أن الوقت حان للتراجع عندما...»</small></label><textarea rows="2" data-k="c"></textarea></div>`;
 const u=()=>{const n=Q.filter((_,i)=>(st[i]||'').trim()).length;const f=$('[data-f]',r);f.className='fb on '+(n===6?'good':'warn');f.innerHTML=n===6?'أجبت عن الأسئلة الستة: لديك قرار جريء ومسؤول، يعرف أين يمكن أن يفشل... وماذا سيفعل حينها.':`أجبت عن ${AR(n)} من ${AR(6)}. إذا لم تستطع الإجابة... فأنت لا تملك قرارًا جريئًا بعد؛ أنت تملك رهانًا.`};
 $$('[data-k]',r).forEach(i=>{i.value=st[i.dataset.k]||'';i.oninput=()=>{st[i.dataset.k]=i.value;store.set('bold6',st);u()}});u();
}};

/* ---------- lab ---------- */
BUILD.lab=el=>{
 setAcc(el,0);
 const items=[];STATIONS.forEach(s=>s.blocks.forEach(b=>{if(b.t==='act'&&ACTS[b.id])items.push([s,b.id])}));
 el.innerHTML=`<span class="eyebrow">مختبر الأنشطة</span><h1 style="font-size:clamp(28px,4vw,40px)">${AR(items.length)} نشاطًا تفاعليًا في مكان واحد</h1><p class="lead" style="margin:10px 0 24px">تجارب ومحاكاة وأدوات تطبيقية وتقييمات ذاتية. تُحفظ إجاباتك وتقدّمك على هذا الجهاز فقط.</p>
 ${STATIONS.map(s=>`<section class="sec" style="margin-top:34px"><h2 style="font-size:21px;display:flex;gap:10px;align-items:center"><span style="width:12px;height:12px;border-radius:50%;background:${s.color}"></span>المحطة ${AR(s.n)}: ${s.short}</h2><div class="lab-grid" style="margin-top:12px">${items.filter(x=>x[0]===s).map(([,id])=>`<a class="lab-card" href="#${s.id}/act-${id}" style="--c:${s.color};text-decoration:none"><span class="k">${ACTS[id].tag}</span><b>${ACTS[id].title}</b></a>`).join('')}</div></section>`).join('')}
 <section class="sec"><h2 style="font-size:21px">أدوات المراجعة</h2><div class="lab-grid" style="margin-top:12px"><a class="lab-card" href="#flash" style="text-decoration:none"><span class="k" style="color:var(--wisdom)">استرجاع نشط</span><b>البطاقات التعليمية</b><span>${AR(FLASH.length)} بطاقة</span></a><a class="lab-card" href="#quiz" style="text-decoration:none"><span class="k" style="color:var(--wisdom)">تقويم ذاتي</span><b>الاختبار الذاتي</b><span>${AR(QUIZ.length)} سؤالًا</span></a><a class="lab-card" href="#home/h-wisdom" style="text-decoration:none"><span class="k" style="color:var(--wisdom)">قائمة تحقق</span><b>نموذج WISDOM × COURAGE</b><span>سبعة أسئلة ترافق كل قرار</span></a></div></section>
 <div style="margin-top:40px"><button class="btn ghost sm" data-wipe>مسح كل إجاباتي المحفوظة</button></div>`;
 $('[data-wipe]',el).onclick=()=>{if(!confirm('سيتم حذف جميع الإجابات والتقدّم المحفوظ على هذا الجهاز. متابعة؟'))return;try{Object.keys(localStorage).filter(k=>k.startsWith('dm28:')).forEach(k=>localStorage.removeItem(k))}catch(e){}location.hash='#home';location.reload()};
};

/* ---------- flashcards ---------- */
BUILD.flash=el=>{
 setAcc(el,0);
 let f='all',order=[],i=0;const known=store.get('known',{});
 el.innerHTML=`<div style="text-align:center"><span class="eyebrow">استرجاع نشط</span><h1 style="font-size:clamp(28px,4vw,40px)">البطاقات التعليمية</h1><p class="lead" style="margin:10px auto 22px">اقرأ المصطلح، حاول تذكّر معناه، ثم اقلب البطاقة. صنّف كل بطاقة: «أتقنتها» أو «أراجعها».</p></div>
 <div class="filters" data-flt><button class="chip" data-f="all">الكل</button>${STATIONS.map(s=>`<button class="chip" data-f="${s.n}">المحطة ${AR(s.n)}</button>`).join('')}<button class="chip" data-f="rev">للمراجعة فقط</button></div>
 <div class="fc-stage"><div class="fc" tabindex="0" role="button" aria-label="اقلب البطاقة"><div class="face front"><span class="st" data-st></span><h3 data-t></h3><span class="en" data-en style="font-size:15px"></span><span class="hint">اضغط أو استخدم المسافة للقلب · الأسهم للتنقل</span></div><div class="face back"><p data-b></p><span class="hint">اضغط للعودة</span></div></div></div>
 <div class="fc-ctl"><button class="btn ghost sm" data-prev aria-label="السابقة">→ السابقة</button><span class="fc-count" data-c></span><button class="btn ghost sm" data-next aria-label="التالية">التالية ←</button></div>
 <div class="fc-ctl"><button class="btn sm" data-k style="background:var(--ok);border-color:var(--ok)">✔ أتقنتها</button><button class="btn sm ghost" data-r>↺ أراجعها</button><button class="btn sm ghost" data-sh>🔀 خلط</button></div>
 <p class="muted" style="text-align:center;margin-top:14px" data-sum></p>`;
 const card=$('.fc',el);
 const build=()=>{order=FLASH.map((x,k)=>k).filter(k=>f==='all'?true:f==='rev'?!known[k]:FLASH[k][0]==+f||(FLASH[k][0]===0&&f!=='rev'&&false));i=0;show()};
 const show=()=>{card.classList.remove('flip');$$('[data-flt] .chip',el).forEach(c=>c.setAttribute('aria-pressed',c.dataset.f===f));
  const tot=Object.values(known).filter(Boolean).length;$('[data-sum]',el).textContent=`أتقنت ${AR(tot)} من ${AR(FLASH.length)} بطاقة`;
  if(!order.length){$('[data-t]',el).textContent='لا بطاقات هنا';$('[data-st]',el).textContent='';$('[data-en]',el).textContent='';$('[data-b]',el).textContent='أحسنت! أتقنت كل البطاقات في هذا التصنيف.';$('[data-c]',el).textContent='—';return}
  const c=FLASH[order[i]];const n=c[0];
  $('[data-st]',el).textContent=(n?`المحطة ${AR(n)} · ${STATIONS[n-1].short}`:'نموذج البرنامج')+(known[order[i]]?' · ✔ أتقنتها':'');$('[data-st]',el).style.color=stColor(n);
  $('[data-t]',el).textContent=c[1];$('[data-en]',el).textContent=c[2];$('[data-b]',el).textContent=c[3];
  $('.back',el).style.background=n?`color-mix(in srgb, ${stColor(n)} 88%, #000)`:'var(--wisdom)';
  $('[data-c]',el).textContent=`${AR(i+1)} / ${AR(order.length)}`};
 const mv=d=>{if(!order.length)return;i=(i+d+order.length)%order.length;show()};
 card.onclick=()=>card.classList.toggle('flip');
 card.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();card.classList.toggle('flip')}if(e.key==='ArrowLeft')mv(1);if(e.key==='ArrowRight')mv(-1)};
 $('[data-next]',el).onclick=()=>mv(1);$('[data-prev]',el).onclick=()=>mv(-1);
 $('[data-k]',el).onclick=()=>{if(!order.length)return;known[order[i]]=true;store.set('known',known);if(f==='rev'){order.splice(i,1);if(i>=order.length)i=0;show()}else mv(1)};
 $('[data-r]',el).onclick=()=>{if(!order.length)return;known[order[i]]=false;store.set('known',known);mv(1)};
 $('[data-sh]',el).onclick=()=>{for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]]}i=0;show()};
 $$('[data-flt] .chip',el).forEach(c=>c.onclick=()=>{f=c.dataset.f;build()});
 build();
};

/* ---------- quiz ---------- */
BUILD.quiz=el=>{
 setAcc(el,0);
 let set=[],i=0,score=0,ans=[];
 const start=f=>{set=QUIZ.map((q,k)=>k).filter(k=>f==='all'||QUIZ[k][0]==+f);i=0;score=0;ans=[];q()};
 const intro=()=>{el.innerHTML=`<div class="qz"><div style="text-align:center"><span class="eyebrow">تقويم ذاتي</span><h1 style="font-size:clamp(28px,4vw,40px)">الاختبار الذاتي</h1><p class="lead" style="margin:10px auto 24px">أسئلة مبنية على حالات الدورة، مع تغذية راجعة فورية تشرح لماذا. اختر نطاق الاختبار.</p></div>
  <div class="opts"><button class="opt" data-f="all"><b style="font-family:var(--display)">الاختبار الشامل</b> · ${AR(QUIZ.length)} سؤالًا</button>${STATIONS.map(s=>`<button class="opt" data-f="${s.n}"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${s.color};margin-inline-end:8px"></span><b style="font-family:var(--display)">المحطة ${AR(s.n)}: ${s.short}</b> · ${AR(QUIZ.filter(x=>x[0]===s.n).length)} أسئلة</button>`).join('')}</div>
  ${store.get('best',null)!=null?`<p class="muted" style="text-align:center;margin-top:16px">أفضل نتيجة سابقة في الاختبار الشامل: ${AR(store.get('best'))}%</p>`:''}</div>`;
  $$('.opt',el).forEach(b=>b.onclick=()=>{el.dataset.f=b.dataset.f;start(b.dataset.f)})};
 const q=()=>{const Q=QUIZ[set[i]];const n=Q[0];el.style.setProperty('--acc',stColor(n));el.style.setProperty('--acct',stTint(n));
  el.innerHTML=`<div class="qz"><div class="qhead"><span>السؤال ${AR(i+1)} من ${AR(set.length)} · المحطة ${AR(n)}</span><span>النتيجة: ${AR(score)}</span></div><div class="qbar"><i style="width:${i/set.length*100}%"></i></div><h3>${Q[1]}</h3><div class="opts">${Q[2].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div><div class="fb"></div><div style="margin-top:16px;display:flex;justify-content:space-between"><button class="btn ghost sm" data-quit>إنهاء</button><button class="btn sm hide" data-n>${i+1<set.length?'السؤال التالي':'عرض النتيجة'}</button></div></div>`;
  $$('.opt',el).forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=j===Q[3];if(ok)score++;ans.push(ok);$$('.opt',el).forEach((x,k)=>{x.disabled=true;if(k===Q[3])x.classList.add('ok');else if(k===j)x.classList.add('no')});const f=$('.fb',el);f.className='fb on '+(ok?'good':'warn');f.innerHTML=`<b>${ok?'إجابة صحيحة.':'ليست الإجابة الأدق.'}</b> ${Q[4]}`;$('[data-n]',el).classList.remove('hide');$('[data-n]',el).focus()});
  $('[data-n]',el).onclick=()=>{i++;i<set.length?q():res()};$('[data-quit]',el).onclick=intro};
 const res=()=>{const p=Math.round(score/set.length*100);if(el.dataset.f==='all'){const b=store.get('best',0);if(p>b)store.set('best',p)}
  const wk=STATIONS.map(s=>{const idx=set.map((k,m)=>[k,m]).filter(([k])=>QUIZ[k][0]===s.n);if(!idx.length)return null;const c=idx.filter(([,m])=>ans[m]).length;return [s,c,idx.length]}).filter(Boolean);
  el.style.setProperty('--acc','var(--wisdom)');
  el.innerHTML=`<div class="qz"><div class="score"><span class="eyebrow">النتيجة</span><div class="big num">${AR(p)}%</div><p class="lead" style="margin:0 auto">${AR(score)} إجابات صحيحة من ${AR(set.length)}. ${p>=85?'أداء صانع قرار متمكّن.':p>=60?'أساس جيد؛ راجع المحطات الأضعف.':'راجع المحطات والبطاقات ثم أعد المحاولة.'}</p></div>
  <div class="tw"><table class="t"><thead><tr><th>المحطة</th><th>الصحيحة</th><th></th></tr></thead><tbody>${wk.map(([s,c,t])=>`<tr><td>${AR(s.n)}. ${s.short}</td><td class="num">${AR(c)} / ${AR(t)}</td><td>${c<t?`<a href="#${s.id}">راجع المحطة</a>`:'✔'}</td></tr>`).join('')}</tbody></table></div>
  <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap"><button class="btn" data-again>أعد الاختبار</button><button class="btn ghost" data-other>اختر نطاقًا آخر</button><a class="btn ghost" href="#flash">البطاقات التعليمية</a></div></div>`;
  $('[data-again]',el).onclick=()=>start(el.dataset.f);$('[data-other]',el).onclick=intro};
 intro();
};

/* ---------- glossary ---------- */
BUILD.gloss=el=>{
 setAcc(el,0);
 const G=[];const seen=new Set();
 STATIONS.forEach(s=>s.blocks.forEach(b=>{if(b.t==='cards')b.items.forEach(c=>{if(!seen.has(c.t)){seen.add(c.t);G.push([c.t,c.en,c.d,s.n])}})}));
 GLOSS_EXTRA.forEach(g=>{if(!seen.has(g[0])){seen.add(g[0]);G.push([g[0],g[1],g[2],0])}});
 G.sort((a,b)=>a[0].localeCompare(b[0],'ar'));
 el.innerHTML=`<span class="eyebrow">مرجع سريع</span><h1 style="font-size:clamp(28px,4vw,40px)">مسرد المصطلحات</h1><p class="lead" style="margin:10px 0 20px">${AR(G.length)} مصطلحًا بالعربية والإنجليزية. ابحث بأي من اللغتين.</p>
 <input type="text" data-q placeholder="ابحث عن مصطلح… مثل: تحيّز، drift، الحلقة" aria-label="بحث في المسرد" style="max-width:520px;margin-bottom:20px"><div class="gl" data-l></div>`;
 const R=q=>{q=q.trim().toLowerCase();const L=G.filter(g=>!q||(g[0]+' '+g[1]+' '+g[2]).toLowerCase().includes(q));$('[data-l]',el).innerHTML=L.length?L.map(g=>`<div class="box"><h3><span>${g[0]}</span><span class="en">${g[1]}</span></h3><p>${g[2]}</p>${g[3]?`<a href="#s${g[3]}" style="font-size:13px;color:${stColor(g[3])}">المحطة ${AR(g[3])}</a>`:''}</div>`).join(''):'<p class="muted">لا نتائج. جرّب كلمة أقصر أو المصطلح الإنجليزي.</p>'};
 $('[data-q]',el).oninput=e=>R(e.target.value);R('');
};

/* ---------- init ---------- */
renderTabs();route();

</script>
